[build]
  base    = "Virtus Feed Folder/web"
  command = "npm run build"
  publish = "Virtus Feed Folder/web/dist"

# React Router owns every path; without this, a deep link like /pens reaches
# Netlify as a real path, finds no file and 404s.
#
# public/_redirects carries the same rules, because a drag-and-drop deploy
# publishes dist/ and never reads this file. Any new root-level page needs its
# rule added to BOTH, above the catch-all — first match wins.
# Play and the App Store both require a reachable privacy policy URL, and it has
# to survive the SPA catch-all below — hence an explicit rule, above it.
[[redirects]]
  from   = "/privacy"
  to     = "/privacy.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
