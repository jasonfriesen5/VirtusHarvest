ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    nordicDfuVersion = project.hasProperty('nordicDfuVersion') ? rootProject.ext.nordicDfuVersion : '2.9.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.virtusharvest.dfu"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    // Deliberately compileOptions only, with no `kotlin { jvmToolchain(21) }`.
    // A toolchain block is a *strict* request for a JDK of exactly that major
    // version; that is precisely what made @capacitor/filesystem unbuildable on
    // a machine carrying JDK 17 and 25. sourceCompatibility is satisfied by any
    // JDK >= 21, so this module builds anywhere the rest of the app does.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Nordic's own Android DFU library — the counterpart to IOS-DFU-Library used
    // by the Swift plugin. Speaks both Secure and Legacy DFU.
    implementation "no.nordicsemi.android:dfu:$nordicDfuVersion"
    testImplementation "junit:junit:$junitVersion"
}
